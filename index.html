<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProofTube WebRTC Client Test</title>
  <style>
    body { font-family: monospace; background: #121212; color: #00ff66; padding: 20px; }
    h1 { color: #fff; font-family: sans-serif; }
    #console { background: #000; padding: 15px; border-radius: 5px; height: 350px; overflow-y: auto; border: 1px solid #333; }
    .log { margin-bottom: 5px; }
    .err { color: #ff5555; }
    .info { color: #00bbff; }
    .success { color: #00ff66; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 15px; cursor: pointer; background: #222; color: #888; border: 1px solid #444; border-radius: 4px; }
    button.active { background: #00ff66; color: #000; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <h1>ProofTube WebRTC Client Test</h1>
  <p>Endpoint: <b style="color:#fff;">wss://melvin.me/.webrtc</b></p>
  <p>Room Hash: <b style="color:#fff;" id="hash-display"></b></p>

  <div id="console"></div>

  <button id="sendBtn" disabled>Send Test Chunk</button>

  <script>
    // Valid SHA-256 Resource Hash — any hex hash creates its room on first
    // announce (Pod Signaling Protocol §6); nothing is provisioned server-side.
    const RESOURCE_HASH = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855";
    document.getElementById("hash-display").innerText = RESOURCE_HASH;

    const logBox = document.getElementById("console");
    const sendBtn = document.getElementById("sendBtn");

    // Local label only — the server assigns the real peer id and sends it
    // as `from` in relayed frames; anything we invent here is ignored.
    const peerId = "peer_" + Math.random().toString(36).substring(7);

    function log(msg, type = "info") {
      const time = new Date().toISOString().split("T")[1].slice(0, 8);
      const div = document.createElement("div");
      div.className = `log ${type}`;
      div.innerText = `[${time}] ${msg}`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    log(`Initialized Client ID: ${peerId}`, "info");

    let ws;
    let pc;
    let dataChannel;
    let myOfferId = null;      // set when we are the offering side
    let keepalive = null;      // idle sockets are dropped after ~50s (SPEC §2.1)

    function initWebRTC() {
      pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          log(`ICE Candidate generated: ${event.candidate.candidate.slice(0, 30)}...`, "info");
        }
      };

      pc.oniceconnectionstatechange = () => log(`ICE Connection State: ${pc.iceConnectionState}`, "info");

      pc.ondatachannel = (event) => {
        dataChannel = event.channel;
        setupDataChannel();
      };
    }

    // The room dialect has no trickle ICE: candidates must be baked into the
    // SDP, so wait for gathering to finish before sending it (SPEC §6).
    function waitForIceComplete() {
      if (pc.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const done = () => { pc.removeEventListener("icegatheringstatechange", check); resolve(); };
        const check = () => { if (pc.iceGatheringState === "complete") done(); };
        pc.addEventListener("icegatheringstatechange", check);
        setTimeout(done, 3000); // fallback: ship what we have
      });
    }

    function setupDataChannel() {
      dataChannel.onopen = () => {
        log(">>> P2P DataChannel is OPEN! You are connected! <<<", "success");
        sendBtn.disabled = false;
        sendBtn.classList.add("active");
        clearInterval(keepalive); // the P2P link no longer needs the signaling socket
      };

      dataChannel.onmessage = (e) => {
        log(`RECV P2P CHUNK: ${e.data}`, "success");
      };
    }

    function sendSignal(payload) {
      log(`WS SEND [${payload.type}]: ${JSON.stringify(payload).slice(0, 120)}`, "info");
      ws.send(JSON.stringify(payload));
    }

    function connect() {
      log("Connecting to signaling endpoint: wss://melvin.me/.webrtc...");
      ws = new WebSocket("wss://melvin.me/.webrtc");

      ws.onopen = () => {
        log("WebSocket Connection Established.", "success");
        initWebRTC();

        // Join the room with no offers yet; the reply's `count` tells us
        // whether anyone is already waiting (count excludes ourselves).
        sendSignal({ type: "announce", resource: RESOURCE_HASH, offers: [] });

        // Keepalive: re-announce with empty offers every 25s — announce is an
        // idempotent membership refresh, and idle sockets die at ~50s.
        keepalive = setInterval(() => {
          if (ws.readyState === 1) sendSignal({ type: "announce", resource: RESOURCE_HASH, offers: [] });
        }, 25000);
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        log(`WS RECV: ${JSON.stringify(msg).slice(0, 120)}`, msg.type === "error" ? "err" : "info");

        // Someone is already in the room -> we are the offering side.
        // Offers travel INSIDE an announce (SPEC §6), one per existing peer.
        if (msg.type === "resource-peers" && msg.count > 0 && !myOfferId && !dataChannel) {
          log(`Found ${msg.count} peer(s) in room. Creating WebRTC Offer...`, "info");
          dataChannel = pc.createDataChannel("prooftube-chunks");
          setupDataChannel();

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          await waitForIceComplete();

          myOfferId = "o_" + Math.random().toString(36).substring(7);
          sendSignal({
            type: "announce",
            resource: RESOURCE_HASH,
            offers: [{ offer_id: myOfferId, sdp: pc.localDescription.sdp }]
          });
        }

        // A peer's offer, relayed to us. `from` is the server-assigned id of
        // the other peer — answer back to it, echoing the offer_id.
        if (msg.type === "offer" && msg.sdp && !myOfferId) {
          log("Offer received from peer. Generating Answer...", "info");
          await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          await waitForIceComplete();

          sendSignal({
            type: "answer",
            resource: RESOURCE_HASH,
            to: msg.from,
            offer_id: msg.offer_id,
            sdp: pc.localDescription.sdp
          });
        }

        // The answer to OUR offer (matched by offer_id; arrives with `from`).
        if (msg.type === "answer" && msg.offer_id === myOfferId && msg.sdp) {
          log("Answer received from peer. Completing Handshake...", "success");
          await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
        }
      };

      ws.onerror = () => log("WebSocket Error encountered.", "err");
      ws.onclose = () => log("WebSocket Connection closed.", "err");
    }

    sendBtn.onclick = () => {
      const chunk = "CHUNK_" + Math.random().toString(36).substring(2, 10);
      log(`SEND P2P CHUNK: ${chunk}`, "success");
      dataChannel.send(chunk);
    };

    connect();
  </script>
</body>
</html>
