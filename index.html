<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProofTube WebRTC Client Test</title>
  <style>
    body { font-family: monospace; background: #121212; color: #00ff66; padding: 20px; }
    h1 { color: #fff; font-family: sans-serif; }
    #console { background: #000; padding: 15px; border-radius: 5px; height: 350px; overflow-y: auto; border: 1px solid #333; }
    .log { margin-bottom: 5px; }
    .err { color: #ff5555; }
    .info { color: #00bbff; }
    .success { color: #00ff66; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 15px; cursor: pointer; background: #222; color: #888; border: 1px solid #444; border-radius: 4px; }
    button.active { background: #00ff66; color: #000; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <h1>ProofTube WebRTC Client Test</h1>
  <p>Endpoint: <b style="color:#fff;">wss://melvin.me/.webrtc</b></p>
  <p>Resource Hash: <b style="color:#fff;" id="hash-display"></b></p>

  <div id="console"></div>

  <button id="sendBtn" disabled>Send Test Chunk</button>

  <script>
    const RESOURCE_HASH = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855";
    document.getElementById("hash-display").innerText = RESOURCE_HASH;

    const logBox = document.getElementById("console");
    const sendBtn = document.getElementById("sendBtn");

    function log(msg, type = "info") {
      const time = new Date().toISOString().split("T")[1].slice(0, 8);
      const div = document.createElement("div");
      div.className = `log ${type}`;
      div.innerText = `[${time}] ${msg}`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    let ws;
    let pc;
    let dataChannel;

    function initWebRTC() {
      pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });

      pc.oniceconnectionstatechange = () => log(`ICE Connection State: ${pc.iceConnectionState}`, "info");

      pc.ondatachannel = (event) => {
        dataChannel = event.channel;
        setupDataChannel();
      };
    }

    function setupDataChannel() {
      dataChannel.onopen = () => {
        log(">>> P2P DataChannel is OPEN! You are connected! <<<", "success");
        sendBtn.disabled = false;
        sendBtn.classList.add("active");
      };

      dataChannel.onmessage = (e) => {
        log(`RECV P2P CHUNK: ${e.data}`, "success");
      };
    }

    function connect() {
      log("Connecting to signaling endpoint: wss://melvin.me/.webrtc...");
      ws = new WebSocket("wss://melvin.me/.webrtc");

      ws.onopen = () => {
        log("WebSocket Connection Established.", "success");
        initWebRTC();

        const initAnnounce = {
          type: "announce",
          resource: RESOURCE_HASH,
          offers: []
        };
        log(`WS SEND [announce (initial)]: ${JSON.stringify(initAnnounce)}`, "info");
        ws.send(JSON.stringify(initAnnounce));
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        log(`WS RECV: ${JSON.stringify(msg)}`, msg.type === "error" ? "err" : "info");

        if (msg.type === "announce" || msg.type === "peers" || msg["resource-peers"]) {
          const count = msg["resource-peers"]?.count ?? msg.count ?? 0;
          
          if (count > 0 && !dataChannel) {
            log(`Found ${count} peer(s) present. Creating WebRTC Offer...`, "info");
            
            dataChannel = pc.createDataChannel("prooftube-chunks");
            setupDataChannel();

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            log("Gathering ICE candidates (Waiting for complete SDP)...", "info");

            pc.onicegatheringstatechange = () => {
              if (pc.iceGatheringState === "complete") {
                log("ICE Gathering Complete. Re-announcing with full SDP offer...", "success");
                
                const reAnnounce = {
                  type: "announce",
                  resource: RESOURCE_HASH,
                  offers: [{
                    offer_id: "o1",
                    sdp: pc.localDescription.sdp
                  }]
                };
                ws.send(JSON.stringify(reAnnounce));
              }
            };
          }
        }

        if (msg.type === "offer") {
          log("Offer received. Generating Answer...", "info");
          await pc.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: msg.sdp }));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          pc.onicegatheringstatechange = () => {
            if (pc.iceGatheringState === "complete") {
              const answerMsg = {
                type: "answer",
                resource: RESOURCE_HASH,
                to: msg.from,
                sdp: pc.localDescription.sdp
              };
              ws.send(JSON.stringify(answerMsg));
            }
          };
        }

        if (msg.type === "answer") {
          log("Answer received. Completing Handshake...", "success");
          await pc.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: msg.sdp }));
        }
      };

      ws.onerror = (err) => log(`WebSocket Error`, "err");
      ws.onclose = () => log("WebSocket Connection closed.", "err");
    }

    sendBtn.addEventListener("click", () => {
      if (dataChannel && dataChannel.readyState === "open") {
        const payload = `PROOFTUBE_CHUNK_HASH_${Math.random().toString(36).substring(7).toUpperCase()}`;
        dataChannel.send(payload);
        log(`SENT P2P CHUNK: ${payload}`, "info");
      }
    });

    connect();
  </script>
</body>
</html>
