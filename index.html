<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProofTube - WebRTC Signaling Conformance Test</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d1117;
            color: #58a6ff;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
        }
        h1 { color: #f0f6fc; font-size: 1.5rem; margin-top: 0; }
        .info { margin-bottom: 15px; color: #8b949e; font-size: 0.9rem; }
        .info code { color: #79c0ff; }
        #logConsole {
            background-color: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            height: 350px;
            overflow-y: auto;
            padding: 12px;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .log-entry { margin-bottom: 4px; word-break: break-all; }
        .log-sent { color: #79c0ff; }
        .log-received { color: #7ee787; }
        .log-error { color: #ff7b72; }
        .log-info { color: #8b949e; }
        button {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240,246,252,0.1);
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 15px;
        }
        button:disabled {
            background-color: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ProofTube WebRTC Client Test</h1>
    <div class="info">
        Endpoint: <code>wss://melvin.me/.webrtc</code><br>
        Room Hash: <code>c0ffee006a6f34f5</code>
    </div>

    <div id="logConsole"></div>

    <button id="sendChunkBtn" disabled onclick="sendTestChunk()">Send Test Chunk</button>
</div>

<script>
    const SIGNALING_URL = 'wss://melvin.me/.webrtc';
    const ROOM_HASH = 'c0ffee006a6f34f5';

    const consoleEl = document.getElementById('logConsole');
    const sendBtn = document.getElementById('sendChunkBtn');

    let ws = null;
    let pc = null;
    let dataChannel = null;
    let myPeerId = 'peer_' + Math.random().toString(36).substring(2, 8);

    function log(message, category = 'info') {
        const div = document.createElement('div');
        div.className = `log-entry log-${category}`;
        const time = new Date().toLocaleTimeString();
        div.textContent = `[${time}] ${message}`;
        consoleEl.appendChild(div);
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function init() {
        log(`Initialized Client ID: ${myPeerId}`, 'info');
        connectSignaling();
    }

    function connectSignaling() {
        log(`Connecting to signaling endpoint: ${SIGNALING_URL}...`, 'info');
        ws = new WebSocket(SIGNALING_URL);

        ws.onopen = () => {
            log('WebSocket Connection Established.', 'received');
            // Announce presence in content-addressed room
            sendSignal({
                type: 'announce',
                room: ROOM_HASH,
                peer_id: myPeerId
            });
        };

        ws.onmessage = async (event) => {
            try {
                const msg = JSON.parse(event.data);
                log(`WS RECV [${msg.type}]: ${JSON.stringify(msg)}`, 'received');
                handleSignal(msg);
            } catch (err) {
                log(`Failed to parse WS payload: ${err.message}`, 'error');
            }
        };

        ws.onerror = () => log('WebSocket Error encountered.', 'error');
        ws.onclose = () => log('WebSocket Connection closed.', 'error');

        createPeerConnection();
    }

    function createPeerConnection() {
        pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });

        pc.ondatachannel = (event) => {
            log('Remote DataChannel received!', 'received');
            setupDataChannel(event.channel);
        };
    }

    function handleSignal(msg) {
        switch (msg.type) {
            case 'resource-peers':
                log(`Room peer count: ${msg.count}`, 'info');
                // If more than 1 peer is present, initiate offer
                if (msg.count > 1) {
                    initiateOffer();
                }
                break;
            case 'offer':
                if (msg.from !== myPeerId) handleOffer(msg);
                break;
            case 'answer':
                if (msg.from !== myPeerId) handleAnswer(msg);
                break;
        }
    }

    async function initiateOffer() {
        log('Creating local DataChannel...', 'info');
        dataChannel = pc.createDataChannel('prooftube-stream');
        setupDataChannel(dataChannel);

        log('Generating SDP Offer...', 'info');
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        sendSignal({
            type: 'offer',
            room: ROOM_HASH,
            from: myPeerId,
            sdp: offer.sdp
        });
    }

    async function handleOffer(msg) {
        log('Processing remote SDP Offer...', 'info');
        await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: msg.sdp }));
        
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        sendSignal({
            type: 'answer',
            room: ROOM_HASH,
            to: msg.from,
            from: myPeerId,
            sdp: answer.sdp
        });
    }

    async function handleAnswer(msg) {
        log('Processing remote SDP Answer...', 'info');
        await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: msg.sdp }));
        log('WebRTC Session Handshake Complete.', 'received');
    }

    function setupDataChannel(channel) {
        dataChannel = channel;

        dataChannel.onopen = () => {
            log('>>> DataChannel is OPEN and ready for data transfer! <<<', 'received');
            sendBtn.disabled = false;
        };

        dataChannel.onmessage = (event) => {
            log(`DATA RECEIVED: "${event.data}"`, 'received');
        };

        dataChannel.onclose = () => {
            log('DataChannel closed.', 'error');
            sendBtn.disabled = true;
        };
    }

    function sendSignal(payload) {
        log(`WS SEND [${payload.type}]: ${JSON.stringify(payload)}`, 'sent');
        ws.send(JSON.stringify(payload));
    }

    function sendTestChunk() {
        const testPayload = "SHA256_CHUNK_TEST_HASH_" + Math.random().toString(36).substring(2, 10);
        log(`Sending Data Chunk: ${testPayload}`, 'sent');
        dataChannel.send(testPayload);
    }

    window.onload = init;
</script>

</body>
</html>
